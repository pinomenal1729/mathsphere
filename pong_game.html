<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h1 {
            color: white;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 10px;
        }

        #gameCanvas {
            background-color: #1a1a2e;
            border: 5px solid #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            display: block;
            cursor: none;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            width: 800px;
            color: white;
            font-size: 1.8em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            gap: 100px;
        }

        .score-section {
            text-align: center;
            min-width: 150px;
        }

        .score-section h2 {
            font-size: 0.8em;
            color: #00ff88;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .score-number {
            font-size: 2em;
            color: #00ff88;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
        }

        .controls {
            color: white;
            font-size: 0.95em;
            text-align: center;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 25px;
            border-radius: 10px;
            border: 2px solid #00ff88;
        }

        .controls h3 {
            color: #00ff88;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .controls p {
            margin: 5px 0;
        }

        .key {
            background: #00ff88;
            color: #1a1a2e;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
            font-size: 0.9em;
        }

        .reset-btn {
            margin-top: 15px;
            padding: 10px 30px;
            font-size: 1em;
            background: #00ff88;
            color: #1a1a2e;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            background: #00ff66;
            transform: scale(1.05);
        }

        .reset-btn:active {
            transform: scale(0.98);
        }

        .game-info {
            color: white;
            font-size: 0.9em;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 PONG GAME 🎮</h1>
        
        <div class="scoreboard">
            <div class="score-section">
                <h2>Player</h2>
                <div class="score-number" id="playerScore">0</div>
            </div>
            <div class="score-section">
                <h2>Computer</h2>
                <div class="score-number" id="computerScore">0</div>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <div class="controls">
            <h3>Controls</h3>
            <p><span class="key">↑ UP ARROW</span> or <span class="key">MOUSE</span> - Move paddle up</p>
            <p><span class="key">↓ DOWN ARROW</span> or <span class="key">MOUSE</span> - Move paddle down</p>
            <p>Computer paddle moves automatically</p>
            <button class="reset-btn" onclick="resetGame()">Reset Game</button>
        </div>

        <div class="game-info">
            <p>First to 5 points wins! 🏆</p>
        </div>
    </div>

    <script src="pong_game.js"></script>
</body>
</html>
